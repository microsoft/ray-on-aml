name: CI and Integration Test 
on:
  push:
    branches: 
      - master
    paths:
      - .github/workflows/ci.yml
      - src/**
      - tests/automated_tests/**
jobs:
  CI_And_Integration_Test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - name: Setup python
        uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2.3.4
        with:
          python-version: '3.8' # Version range or exact version of a Python version to use, using SemVer's version range syntax
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build
          python -m pip install --upgrade twine
      - name: AZ Login
        uses: azure/login@cb79c773a3cfa27f31f25eb3f677781210c9ce3d # v1.6.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install az ml & set default values for AML
        run: |
          az extension add -n ml -y 
          az configure --defaults group=${{ vars.AZURE_RESOURCE_GROUP }} workspace=${{ vars.AZURE_WORKSPACE_NAME }} location=${{ vars.AZURE_LOCATION }}
      - name: run ray rl test
        run: |
          az ml environment create -g ${{ vars.AZURE_RESOURCE_GROUP }} -w ${{ vars.AZURE_WORKSPACE_NAME }} -f tests/automated_tests/test_rl/env.yml
          run_id=$(az ml job create -f tests/automated_tests/test_rl/job.yml --query name -o tsv)
          if [[ -z "$run_id" ]]
          then
            echo "Job creation failed"
            exit 3
          fi
          status=$(az ml job show -n $run_id --query status -o tsv)
          if [[ -z "$status" ]]
          then
            echo "Status query failed"
            exit 4
          fi
          running=("Queued" "Starting" "Preparing" "Running" "Finalizing")
          while [[ ${running[*]} =~ $status ]]
          do
            sleep 8 
            status=$(az ml job show -n $run_id --query status -o tsv)
            echo $status
          done
          if [[ "$status" = "Failed" ]]  
          then
            echo "Test case failed"
            exit 3
          fi
      - name: run ray ml test
        run: |
          az ml environment create -g ${{ vars.AZURE_RESOURCE_GROUP }} -w ${{ vars.AZURE_WORKSPACE_NAME }} -f tests/automated_tests/test_ray_ml/env.yml
          run_id=$(az ml job create -f tests/automated_tests/test_ray_ml/job.yml --query name -o tsv)
