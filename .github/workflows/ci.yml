            exit 4
          fi
          running=("Queued" "Starting" "Preparing" "Running" "Finalizing")
          while [[ ${running[*]} =~ $status ]]
          do
            sleep 8 
            status=$(az ml job show -n $run_id --query status -o tsv)
            echo $status
          done
          if [[ "$status" = "Failed" ]]  
          then
            echo "Test case failed"
            exit 3
          fi
      - name: run ray data test
        run: |
          az ml environment create -g ${{ vars.AZURE_RESOURCE_GROUP }} -w ${{ vars.AZURE_WORKSPACE_NAME }} -f tests/automated_tests/test_ray_data/env.yml
