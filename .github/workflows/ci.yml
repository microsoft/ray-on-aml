            echo $status
          done
          if [[ "$status" = "Failed" ]]  
          then
            echo "Test case failed"
            exit 3
          fi
      - name: run ray xgboost-ray test
        run: |
          az ml environment create -g ${{ vars.AZURE_RESOURCE_GROUP }} -w ${{ vars.AZURE_WORKSPACE_NAME }} -f tests/automated_tests/test_xgboost_ray/env.yml
          run_id=$(az ml job create -f tests/automated_tests/test_xgboost_ray/job.yml --query name -o tsv)
